    <script>
      // Protect fetch from being overwritten
      (function() {
        function protect(obj, prop) {
          try {
            const descriptor = Object.getOwnPropertyDescriptor(obj, prop);
            if (descriptor) {
              if (descriptor.get && !descriptor.set) {
                Object.defineProperty(obj, prop, {
                  get: function() { return descriptor.get.call(this); },
                  set: function(v) { console.warn('Attempted to overwrite ' + prop + ', ignored.'); },
                  configurable: true,
                  enumerable: true
                });
                return true;
              }
              if (!descriptor.writable && descriptor.configurable) {
                Object.defineProperty(obj, prop, {
                  value: descriptor.value,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
                return true;
              }
            }
          } catch (e) {}
          return false;
        }
        
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(v) { console.warn('Attempted to overwrite fetch on window, ignored.'); },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          protect(Window.prototype, 'fetch');
        }
      })();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js")
            .then((reg) => {
              console.log("[PWA] Service Worker registrado para uso offline:", reg.scope);
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === "installed" && navigator.serviceWorker.controller) {
                      console.log("[PWA] Nova versão disponível para cache offline.");
                    }
                  };
                }
              };
            })
            .catch((err) => {
              console.warn("[PWA] Falha ao registrar Service Worker:", err);
            });
        });
      }
    </script>
